name: Real-book benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-books:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install EPUBCheck
        run: |
          curl --fail --location --retry 3 https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.2.1/epubcheck.jar" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-${{ runner.os }}-v1
      - run: pip install -e '.[dev,transcribe]'
      - run: python -m pytest
      - name: Prepare and validate source EPUBs
        run: |
          python -m benchmarks.real_books --prepare-only
          for book in benchmarks/data/*/book.epub; do
            java -jar "$EPUBCHECK_JAR" "$book" || exit 1
          done
      - run: python -m benchmarks.real_books
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-book-results
          path: |
            services/api/benchmarks/data/report.json
            services/api/benchmarks/data/*/sources.json
            services/api/benchmarks/data/*/transcript.json
          if-no-files-found: warn
