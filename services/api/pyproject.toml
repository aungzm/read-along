[project]
name = "read-along-api"
version = "0.0.0"
description = "FastAPI service behind the read-along web app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.118",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
  "anyio>=4",
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]
transcribe = [
  "faster-whisper>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
